name: Build Tatkal Assistant APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP_FILE"
          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted
          SETTINGS=$(find extracted -name settings.gradle -o -name settings.gradle.kts | head -n 1)
          test -n "$SETTINGS"
          echo "PROJECT_DIR=$(dirname "$SETTINGS")" >> $GITHUB_ENV

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug
          APK=$(find app/build/outputs/apk/debug -name '*.apk' | head -n 1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/TatkalAssistant.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TatkalAssistant-APK
          path: TatkalAssistant.apk
